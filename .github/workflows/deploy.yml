name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 Check changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nextjs:
              - 'src/**'

      - name: 🔨 Build project (verify)
        if: steps.changes.outputs.nextjs == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.PROJECT_DIR }}/tgsip
            # Обновляем код из репозитория
            OLD_COMMIT=$(git rev-parse HEAD)
            git fetch origin
            # Пытаемся обновить, сохраняя локальные изменения если нужно
            git pull --rebase --autostash origin master || git pull origin master || (git stash && git pull origin master && git stash pop)
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "📦 Old commit: $OLD_COMMIT"
            echo "📦 New commit: $NEW_COMMIT"
            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
              echo "✅ Code updated from $OLD_COMMIT to $NEW_COMMIT"
            else
              echo "⚠️  Code is already up to date"
            fi
            cd ${{ secrets.PROJECT_DIR }}
            # Включаем BuildKit для ускорения сборки
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            # Пересобираем образ (без --pull для ускорения, базовый образ обновляется редко)
            docker compose -f docker-compose.ci.yml build tgsip
            docker image prune -f
            # Пересоздаем и перезапускаем контейнер
            docker compose -f docker-compose.ci.yml up -d --force-recreate --no-deps tgsip
            echo "✅ Project build and deployment completed successfully!"
      
      - name: 📝 migrate database
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.PROJECT_DIR }}/tgsip
            docker compose -f docker-compose.ci.yml exec tgsip npm run migrate